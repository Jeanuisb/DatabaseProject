<!DOCTYPE html>
<html>
  <head>
    <title>Cookbook</title>
    <style>
      body, html {
          min-height: 100%;
          margin: 0;
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          background-color: #f4f4f4;
          color: #333;
          overflow: auto;
      }
      .bg {
          min-height: 100%;
          display: flex;
          justify-content: center;
          align-items: center;
          position: relative;
      }

      nav {
          display: flex;
          flex-wrap: wrap;
          width: 100%;
          background-color: rgba(255, 0, 0, 0.8);
          border-radius: 10px;
          padding: 10px;
          box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
      }

      nav a {
          text-decoration: none;
          display: block;
          text-align: center;
          padding: 15px 25px;
          color: #464141;
          margin: 5px;
          font-weight: 500;
          border-radius: 5px;
          transition: background-color 0.3s ease;
      }

      nav a:last-child {
          margin-left: auto;
      }

      nav a:hover {
          background-color: #777777;
          color: #ffffff;
      }

      .form-container {
          max-width: 500px;
          padding: 20px;
          margin: 20px auto;
          background: white;
          border-radius: 10px;
          box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
      }

      input[type="text"],
      input[type="submit"] {
          padding: 10px;
          margin-top: 8px;
          width: 100%; /* Adjusted width */
          box-sizing: border-box;
          border-radius: 5px;
          border: 1px solid #ccc;
      }

      input[type="submit"] {
          background-color: rgb(189, 185, 185);
          color: #464141;
          cursor: pointer;
          transition: background-color 0.3s ease;
      }

      input[type="submit"]:hover {
          background-color: #777777;
          color: #ffffff;
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="/home">Home</a>
      <a href="/recipes">Recipes</a>
      <a href="/ingredients">Ingredients</a>
      <a href="/cookbook">Cookbook</a>
      <a href="/settings">Account Settings</a>
      <a href="/add_recipe">Create Recipe</a>
      <a href="/logout"">Logout</a>
    </nav>
    <body>


      <div class="form-container">
          {% if step=="compose_entry" %}
              <form action="{{ url_for('create_cookbook') }}" method="post">
                  <label for="title">Cookbook Name:</label>
                  <input type="text" id="title" name="title">
                  <br>
                  <input type="hidden" name="step" value="add_entry">
                  <input type="submit" value="Create a Cookbook">
              </form>
          {% elif step == "add_entry" %}
              Cookbook has been created. <a href="{{url_for('cookbook')}}">Go back to browse cookbooks</a>
          {% endif %}
      </div>
  </body>
